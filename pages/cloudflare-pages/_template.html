<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1" name="viewport">
<title>{{TITLE}}</title>
<link crossorigin="" href="https://cdn.jsdelivr.net" rel="preconnect">
<!-- Geist Sans 改由页面内 @font-face + 拉丁 unicode-range 声明（见 style 头部）——
     否则其内置的中文标点字形会以窄体度量截走 CJK 全宽标点，导致标点与汉字间距过小 -->
<link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.2.5/400.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.2.5/500.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.2.5/chinese-simplified-700.css" rel="stylesheet">
<script>
/* 防闪烁：在首屏绘制前应用已保存/系统的主题，避免浅色下先闪一下深色 */
(function(){
  try{
    var t = localStorage.getItem('dsh-tui-theme');
    if(t !== 'light' && t !== 'dark'){
      t = 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){ document.documentElement.setAttribute('data-theme','light'); }
})();
</script>
<style>

/* ══════════════════════════════════════════════════════════════════
   设计系统 · 气质：工具美学（Raycast / Framer 路线）
   主题：深色 · 冷调中性灰 · 主色 靛蓝 #6B84E8（饱和度 73%，未过 80% 红线）
   ══════════════════════════════════════════════════════════════════ */
/* ─── Geist Sans 仅覆盖拉丁区：默认全范围会让其中文标点字形以窄体截走 CJK 全宽标点 ─── */
@font-face{
  font-family:'Geist Sans';font-style:normal;font-weight:400;font-display:swap;
  src:url('https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.2.5/files/geist-sans-latin-400-normal.woff2') format('woff2');
  unicode-range:U+0-FF,U+131,U+152-153,U+2BB-2BC,U+2C6,U+2DA,U+2DC,U+304,U+308,U+329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
@font-face{
  font-family:'Geist Sans';font-style:normal;font-weight:700;font-display:swap;
  src:url('https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.2.5/files/geist-sans-latin-700-normal.woff2') format('woff2');
  unicode-range:U+0-FF,U+131,U+152-153,U+2BB-2BC,U+2C6,U+2DA,U+2DC,U+304,U+308,U+329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
:root{
  /* 主色（唯一强调色，只用于功能性强调） */
  --accent:#6B84E8;
  --accent-hover:#7d93ee;
  --accent-soft:rgba(107,132,232,.14);
  --accent-line:rgba(107,132,232,.30);
  --accent-glow:rgba(107,132,232,.12);
  --accent2:#4FC3D9;                    /* 仅用于渐变第二色相，不作独立强调色 */

  /* 中性色阶 —— 全页冷调，不混暖灰 */
  --bg:#07080a;
  --panel:#0c0e14;
  --bg-elevated:#0c0e14;
  --surface:rgba(255,255,255,.03);
  --surface-hover:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.08);
  --border-strong:rgba(255,255,255,.15);

  /* 文字三级（必须同时使用才有层次） */
  --text:rgba(255,255,255,.85);
  --muted:rgba(255,255,255,.55);
  --text-secondary:rgba(255,255,255,.55);
  --text-tertiary:rgba(255,255,255,.35);

  /* 功能色 */
  --success:#34d399;
  --warning:#fbbf24;
  --error:#f87171;

  /* 圆角 */
  --radius-sm:6px; --radius:8px; --radius-lg:12px; --radius-xl:16px; --radius-full:9999px;

  /* 字体 */
  --font-display:'Geist Sans','Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  --font-body:'Geist Sans',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  --font-mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
/* ════════ 浅色主题（默认 :root 为深色；[data-theme="light"] 翻为浅色） ════════ */
html{color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
[data-theme="light"]{
  --bg:#f5f6f9;
  --panel:#ffffff;
  --bg-elevated:#ffffff;
  --surface:rgba(17,22,38,.04);
  --surface-hover:rgba(17,22,38,.07);
  --border:rgba(17,22,38,.10);
  --border-strong:rgba(17,22,38,.18);
  --text:rgba(17,22,38,.88);
  --muted:rgba(17,22,38,.60);
  --text-secondary:rgba(17,22,38,.60);
  --text-tertiary:rgba(17,22,38,.42);
  --accent-soft:rgba(107,132,232,.12);
  --accent-line:rgba(107,132,232,.34);
  --accent-glow:rgba(107,132,232,.10);
  --heading:rgba(15,19,32,.95);
  --code:rgba(17,22,38,.88);
}
/* 浅色下：把正文里写死的纯白文字/底色翻成深色，避免“白底白字” */
html[data-theme="light"] h1,html[data-theme="light"] h2,html[data-theme="light"] h3,html[data-theme="light"] h4,
html[data-theme="light"] .card-title,html[data-theme="light"] .timeline .t-title,
html[data-theme="light"] .cmp .col .c-name,html[data-theme="light"] .acc summary,
html[data-theme="light"] table td:first-child,html[data-theme="light"] thead th{color:var(--heading)}
html[data-theme="light"] thead th{background:var(--surface)}
html[data-theme="light"] strong{color:rgba(15,19,32,.95)}
html[data-theme="light"] code{color:var(--code);background:var(--surface)}
html[data-theme="light"] .quote p{color:var(--text-secondary)}
html[data-theme="light"] .note,html[data-theme="light"] .note *{color:var(--text)}
html[data-theme="light"] .code-block pre{color:var(--text)}
html[data-theme="light"] .mini,html[data-theme="light"] .card,html[data-theme="light"] .cmp .col{background:var(--surface)}
html[data-theme="light"] tbody tr:hover{background:var(--surface-hover)}
html[data-theme="light"] .code-head .dots i{background:rgba(17,22,38,.14)}
/* 浅色下：右侧 TOC 导航浮层（圆钮 + 弹出面板）同步翻为浅色，避免“深底深字”看不清 */
html[data-theme="light"] .toc-fab{
  background:var(--bg-elevated);
  border-color:var(--border-strong);
  box-shadow:0 8px 24px rgba(17,22,38,.18), inset 0 1px 0 rgba(255,255,255,.9);
}
html[data-theme="light"] .toc-panel{
  background:var(--bg-elevated);
  border-color:var(--border-strong);
  box-shadow:0 8px 32px rgba(17,22,38,.18), inset 0 1px 0 rgba(255,255,255,.9);
}
html[data-theme="light"] .toc-fab:hover{
  box-shadow:0 12px 32px rgba(17,22,38,.22), 0 0 18px rgba(107,132,232,.22);
}

/* ════════ 主题切换开关（固定右上角） ════════ */
.theme-toggle{position:fixed;top:16px;right:16px;z-index:300;display:inline-flex;align-items:center;gap:7px;
  padding:8px 12px;border-radius:var(--radius-full);cursor:pointer;
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  font-family:var(--font-body);font-size:13px;line-height:1;font-weight:600;
  box-shadow:0 6px 20px rgba(0,0,0,.16);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  transition:background .2s,border-color .2s,transform .15s}
.theme-toggle:hover{border-color:var(--border-strong);background:var(--surface-hover);transform:translateY(-1px)}
.theme-toggle:active{transform:translateY(0)}
.theme-toggle svg{width:16px;height:16px;display:block;flex:none}
.theme-toggle .t-label{font-weight:600}
.theme-toggle .i-moon{display:none}
html[data-theme="light"] .theme-toggle .i-sun{display:none}
html[data-theme="light"] .theme-toggle .i-moon{display:block}
@media (max-width:640px){
  .theme-toggle{top:10px;right:10px;padding:7px 9px}
  .theme-toggle .t-label{display:none}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  color:var(--text);
  font-family:var(--font-body);
  font-size:16px; line-height:1.75;
  letter-spacing:.005em;
  -webkit-font-smoothing:antialiased;
  /* 背景氛围：噪点纹理 + 双光点径向光晕（技法 7） */
  background:
    url("data:image/svg+xml,<svg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.028'/></svg>"),
    radial-gradient(ellipse 62% 42% at 18% 0%, rgba(107,132,232,.10), transparent 70%),
    radial-gradient(ellipse 52% 46% at 86% 96%, rgba(79,195,217,.06), transparent 72%),
    var(--bg);
  background-attachment:fixed;
}
.wrap{max-width:1152px;margin:0 auto;padding:0 24px 96px}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-hover);text-decoration:underline;text-underline-offset:3px}
code{
  font-family:var(--font-mono);font-size:.88em;
  background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:1px 6px;color:rgba(255,255,255,.92);
  /* 不用 nowrap：行内代码里的长 token（如整条 npm 命令）会把窄屏布局视口撑宽 */
  white-space:normal;overflow-wrap:anywhere;word-break:break-word;
}
strong{font-weight:700;color:rgba(255,255,255,.96)}
em{font-style:italic;color:var(--muted)}

/* ─── 入场动效（技法 4）：blurIn 标题 / fadeUp 区块 ─── */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .6s cubic-bezier(.16,1,.3,1),transform .6s cubic-bezier(.16,1,.3,1)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;transition:none}
  .doc-hero h1{animation:none}
}
@keyframes blurIn{from{opacity:0;filter:blur(8px);transform:translateY(12px)}to{opacity:1;filter:none;transform:none}}

/* ══════════════════ DocHero · 非对称左文右视觉（技法 3） ══════════════════ */
.doc-hero{padding:88px 0 56px;display:grid;gap:48px;align-items:start;
  grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
@media (max-width:860px){.doc-hero{grid-template-columns:1fr;padding:56px 0 40px;gap:32px}}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-soft);
  border:1px solid var(--accent-line);border-radius:var(--radius-full);
  padding:6px 14px;margin-bottom:24px;
}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent2);box-shadow:0 0 8px rgba(79,195,217,.7)}
.doc-hero h1{
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(34px,5.4vw,60px);line-height:1.06;letter-spacing:-.035em;
  margin:0 0 16px;color:#fff;
  animation:blurIn .9s cubic-bezier(.16,1,.3,1) both;
}
.doc-hero h1 .grad{
  background:linear-gradient(120deg,var(--accent) 12%,var(--accent2) 88%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero-sub{
  font-size:clamp(16px,2.1vw,20px);line-height:1.6;color:var(--text-secondary);
  margin:0 0 24px;max-width:34em;
}
.hero-sub b{color:var(--text);font-weight:700}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 32px;padding:0;list-style:none}
.chip{
  font-family:var(--font-mono);font-size:12px;color:var(--muted);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:5px 10px;
}
/* 右侧视觉区：3 张毛玻璃信息卡（技法 1） */
.hero-side{display:flex;flex-direction:column;gap:16px}
.mini{
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:20px;
  box-shadow:0 8px 32px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.10);
  transition:transform .3s cubic-bezier(.2,0,0,1),box-shadow .3s ease,border-color .3s ease;
}
.mini:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.14);border-color:var(--border-strong)}
.mini .k{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);display:block;margin-bottom:8px}
.mini .v{font-size:15px;line-height:1.6;color:var(--text)}
.mini .v code{font-size:12.5px}
.mini.is-accent{border-color:var(--accent-line);
  box-shadow:inset 0 0 6px rgba(107,132,232,.15), inset 0 0 12px rgba(107,132,232,.08), 0 0 24px rgba(107,132,232,.12)}

/* 窄屏：Hero 与摘要卡整体压缩，保证首屏（100vh）内呈现完整信息单元 */
@media (max-width:700px){
  .doc-hero{padding:40px 0 32px;gap:24px}
  .doc-hero h1{font-size:clamp(28px,8.4vw,36px)}
  .hero-sub{font-size:15px;margin-bottom:16px}
  .hero-meta{margin-bottom:20px;gap:6px}
  .eyebrow{font-size:11px;padding:4px 10px;margin-bottom:16px}
  .chip{font-size:11px;padding:4px 8px}
  .hero-side{gap:8px}
  .mini{padding:12px 14px;border-radius:var(--radius)}
  .mini .k{margin-bottom:4px;font-size:10px}
  .mini .v{font-size:13px;line-height:1.55}
  .mini .v code{font-size:11.5px}
}

/* ══════════════════ DataHighlight · Bento 数字条 ══════════════════ */
.stat-band{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;
  margin:-24px 0 72px;
}
@media (max-width:860px){.stat-band{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:48px}}
@media (max-width:460px){.stat-band{grid-template-columns:1fr}}
.stat{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:24px;transition:transform .3s cubic-bezier(.2,0,0,1),border-color .3s ease,background .3s ease;
}
.stat:hover{transform:translateY(-2px);border-color:var(--border-strong);background:var(--surface-hover)}
.stat .n{
  font-family:var(--font-mono);font-weight:500;font-variant-numeric:tabular-nums;
  font-size:clamp(30px,4.6vw,44px);line-height:1;color:var(--accent);
  letter-spacing:-.02em;display:block;margin-bottom:12px;
}
.stat .d{font-size:13.5px;color:var(--text-secondary);line-height:1.6;margin:0}
.stat.wide{grid-column:span 2}
@media (max-width:860px){.stat.wide{grid-column:span 2}}
@media (max-width:460px){.stat.wide{grid-column:span 1}}

/* ══════════════════ 通用 section / 标题 ══════════════════ */
.sec{padding:64px 0 0;border-top:1px solid var(--border);margin-top:64px}
.sec:first-of-type{border-top:0}
@media (max-width:640px){.sec{padding-top:48px;margin-top:48px}}
.sec-head{margin:0 0 32px}
.sec-num{
  font-family:var(--font-mono);font-size:13px;letter-spacing:.1em;
  color:var(--accent);display:block;margin-bottom:12px;
}
.sec-head h2{
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(24px,3.2vw,34px);line-height:1.2;letter-spacing:-.02em;
  margin:0 0 12px;color:#fff;
}
.sec-head .desc{margin:0;color:var(--text-secondary);font-size:15.5px;max-width:none}
h3{
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(18px,2.2vw,21px);line-height:1.3;letter-spacing:-.01em;
  color:#fff;margin:40px 0 16px;
}
h3 .h3-tag{font-family:var(--font-mono);font-size:12px;color:var(--text-tertiary);margin-right:10px;font-weight:400}
h4{font-size:16px;font-weight:700;color:#fff;margin:24px 0 12px}
p{margin:0 0 16px;max-width:none}
ul,ol{margin:0 0 20px;padding-left:0;list-style:none;max-width:none}
ul li,ol li{position:relative;padding-left:24px;margin-bottom:10px}
ul li::before{
  content:'';position:absolute;left:2px;top:.72em;
  width:6px;height:6px;border-radius:50%;background:var(--accent-line);
}
ul li.dash::before{content:'';left:3px;top:.95em;width:10px;height:1px;border-radius:0;background:var(--accent)}
ol{counter-reset:ol}
ol li{counter-increment:ol;padding-left:32px}
ol li::before{
  content:counter(ol);position:absolute;left:0;top:.15em;
  font-family:var(--font-mono);font-size:12px;color:var(--accent);
  border:1px solid var(--accent-line);border-radius:var(--radius-sm);
  width:20px;height:20px;line-height:18px;text-align:center;background:var(--accent-soft);
}

/* ─── 卡片 ─── */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:24px;margin:0 0 24px;
  box-shadow:0 4px 24px rgba(0,0,0,.4);
}
.card.glass{
  background:rgba(255,255,255,.05);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 8px 32px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.10);
}
.card.accent{border-color:var(--accent-line);
  box-shadow:inset 0 0 6px rgba(107,132,232,.15), inset 0 0 12px rgba(107,132,232,.08), 0 0 24px rgba(107,132,232,.12)}
.card>*:last-child{margin-bottom:0}
.card-title{font-family:var(--font-display);font-weight:700;font-size:17px;color:#fff;margin:0 0 12px;letter-spacing:-.01em}

/* ─── 引用 / 提示块 ─── */
.quote{
  position:relative;margin:0 0 24px;padding:20px 24px;
  background:var(--surface);border:1px solid var(--border);
  border-left:3px solid var(--accent);border-radius:0 var(--radius) var(--radius) 0;
}
.quote p{font-size:15.5px;color:rgba(255,255,255,.78);margin:0}
.quote p+p{margin-top:12px}
.quote>*:last-child{margin-bottom:0}
.quote .q-label{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--accent);display:block;margin-bottom:10px;
}
.note{
  margin:0 0 24px;padding:16px 20px;border-radius:var(--radius);
  background:rgba(255,255,255,.035);border:1px solid var(--border);
  font-size:14.5px;color:var(--text-secondary);
}
.note>*:last-child{margin-bottom:0}
.note.warn{border-color:rgba(251,191,36,.30);background:rgba(251,191,36,.07);color:rgba(255,255,255,.80)}
.note.warn strong{color:var(--warning)}
.note.danger{border-color:rgba(248,113,113,.30);background:rgba(248,113,113,.07);color:rgba(255,255,255,.80)}
.note.danger strong{color:var(--error)}
.note.ok{border-color:rgba(52,211,153,.28);background:rgba(52,211,153,.07);color:rgba(255,255,255,.80)}
.note.ok strong{color:var(--success)}

/* ─── 代码块 ─── */
.code-block{
  margin:0 0 24px;border:1px solid var(--border);border-radius:var(--radius-lg);
  overflow:hidden;background:var(--panel);
  box-shadow:0 4px 24px rgba(0,0,0,.35);
}
.code-head{
  display:flex;align-items:center;gap:8px;
  padding:10px 16px;background:rgba(255,255,255,.035);
  border-bottom:1px solid var(--border);
}
.code-head .dots{display:flex;gap:6px}
.code-head .dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.14);display:block}
.code-head .lang{
  margin-left:auto;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text-tertiary);
}
/* 代码块复制按钮（由脚本注入到每个 .code-head） */
.copy-btn{
  margin-left:12px;display:inline-flex;align-items:center;justify-content:center;
  color:var(--text-secondary);
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:5px;cursor:pointer;
  transition:color .2s,border-color .2s,background .2s;
}
.copy-btn:hover{color:var(--text);border-color:var(--border-strong);background:var(--surface-hover)}
.copy-btn.copied{color:var(--success);border-color:var(--accent-line)}
.copy-btn svg{width:13px;height:13px;display:block;flex:none}
/* 代码块编辑按钮（CodeJar 懒加载注入），与复制按钮同款方形图标按钮 */
.edit-btn{
  margin-left:8px;display:inline-flex;align-items:center;justify-content:center;
  color:var(--text-secondary);
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:5px;cursor:pointer;
  transition:color .2s,border-color .2s,background .2s;
}
.edit-btn:hover{color:var(--text);border-color:var(--border-strong);background:var(--surface-hover)}
.edit-btn.active{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.edit-btn svg{width:13px;height:13px;display:block;flex:none}
/* 编辑态：代码块描边点亮；contenteditable 撑满整行并沿用等宽字体 */
.code-block.editing{border-color:var(--accent-line);box-shadow:0 4px 24px rgba(0,0,0,.35),0 0 0 1px var(--accent-line)}
.code-block.editing .code-head{background:var(--accent-soft)}
.code-block pre code[contenteditable]{display:block;min-height:1.7em;outline:none}
html[data-theme="light"] .code-block.editing{box-shadow:0 4px 24px rgba(17,22,38,.14),0 0 0 1px var(--accent-line)}
.code-block pre{
  margin:0;padding:20px 16px;overflow-x:auto;
  font-family:var(--font-mono);font-size:13.5px;line-height:1.75;
  color:rgba(255,255,255,.80);
}
.code-block code{background:none;border:0;padding:0;font-size:inherit;white-space:pre;overflow-wrap:normal;word-break:normal}
.code-block pre::-webkit-scrollbar{height:8px}
.code-block pre::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
.code-block pre code,html[data-theme="light"] .code-block pre code{background:none}
/* ════════ Prism 语法高亮 token 配色（CDN 版）：颜色全部走主题变量，深浅主题自适应 ════════ */
:root{
  --tk-comment:rgba(255,255,255,.34);
  --tk-punct:rgba(255,255,255,.44);
  --tk-keyword:#9FB0F2;
  --tk-string:#69C9A0;
  --tk-function:#5BC8DE;
  --tk-number:#C6A6F2;
  --tk-variable:#A8C7F0;
  --tk-operator:rgba(255,255,255,.58);
  --tk-property:#7FB0E8;
}
[data-theme="light"]{
  --tk-comment:rgba(17,22,38,.46);
  --tk-punct:rgba(17,22,38,.54);
  --tk-keyword:#5A6FD6;
  --tk-string:#1E8F63;
  --tk-function:#1E7E9C;
  --tk-number:#7E56C2;
  --tk-variable:#3A6BB0;
  --tk-operator:rgba(17,22,38,.70);
  --tk-property:#2E6FB0;
}
.code-block .token.comment,.code-block .token.prolog,.code-block .token.doctype,.code-block .token.cdata{color:var(--tk-comment);font-style:italic}
.code-block .token.punctuation{color:var(--tk-punct)}
.code-block .token.keyword,.code-block .token.builtin,.code-block .token.important,.code-block .token.atrule{color:var(--tk-keyword)}
.code-block .token.string,.code-block .token.char,.code-block .token.attr-value,.code-block .token.regex{color:var(--tk-string)}
.code-block .token.function,.code-block .token.class-name,.code-block .token.anchor{color:var(--tk-function)}
.code-block .token.number,.code-block .token.boolean,.code-block .token.constant{color:var(--tk-number)}
.code-block .token.variable,.code-block .token.parameter,.code-block .token.symbol{color:var(--tk-variable)}
.code-block .token.operator,.code-block .token.entity,.code-block .token.url{color:var(--tk-operator)}
.code-block .token.property,.code-block .token.key,.code-block .token.scalar,.code-block .token.attr-name,.code-block .token.tag,.code-block .token.selector{color:var(--tk-property)}
.code-block .token.title{color:var(--tk-function);font-weight:600}
.code-block .token.bold{font-weight:600}
.code-block .token.italic{font-style:italic}
.code-block .token.deleted{color:var(--error)}
.code-block .token.inserted{color:var(--success)}
.cm{color:var(--text-tertiary)}
.ok{color:var(--success)}
.no{color:var(--error)}
.hl{color:var(--accent2)}

/* ─── 表格（窄屏横滚） ─── */
.table-wrap{overflow-x:auto;margin:0 0 24px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:520px}
thead th{
  text-align:left;font-family:var(--font-display);font-weight:700;font-size:13px;
  letter-spacing:.02em;color:#fff;
  padding:14px 16px;background:rgba(255,255,255,.045);

}
tbody td{padding:14px 16px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--text);line-height:1.7}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .25s ease}
tbody tr:hover{background:rgba(255,255,255,.03)}
td code{white-space:normal;overflow-wrap:anywhere;word-break:break-word}
table td:first-child{color:#fff}

/* ─── 时间轴（TimelineList）：五环节主线 ─── */
.timeline{position:relative;margin:0 0 24px;padding-left:0;list-style:none;max-width:none}
.timeline::before{
  content:'';position:absolute;left:15px;top:14px;bottom:14px;width:2px;
  background:linear-gradient(180deg,var(--accent),rgba(79,195,217,.35),transparent);
}
.timeline li{position:relative;padding:0 0 32px 56px;margin:0}
.timeline li:last-child{padding-bottom:0}
.timeline li::before{
  content:counter(tl);counter-increment:tl;
  position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;
  background:var(--bg);border:1px solid var(--accent-line);
  box-shadow:0 0 0 4px rgba(107,132,232,.10);
  font-family:var(--font-mono);font-size:13px;color:var(--accent);
  display:flex;align-items:center;justify-content:center;
}
.timeline{counter-reset:tl}
.timeline .t-title{font-family:var(--font-display);font-weight:700;font-size:17px;color:#fff;margin:2px 0 8px;letter-spacing:-.01em}
.timeline .t-body{font-size:14.5px;color:var(--text-secondary);margin:0 0 12px;max-width:none}

  border-radius:var(--radius-sm);padding:2px 8px;margin-left:8px;vertical-align:2px;
}

/* ─── 对比网格（ComparisonGrid）：三档权限 ─── */
.cmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:0 0 24px}
@media (max-width:820px){.cmp{grid-template-columns:1fr}}
.cmp .col{

}

.cmp .col.pick{border-color:var(--accent-line);
  box-shadow:inset 0 0 6px rgba(107,132,232,.15), inset 0 0 12px rgba(107,132,232,.08), 0 0 24px rgba(107,132,232,.12)}

}

/* ─── 折叠面板（AccordionSection） ─── */
.acc{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin:0 0 24px;background:var(--surface)}
.acc details{border-bottom:1px solid var(--border)}
.acc details:last-child{border-bottom:0}
.acc summary{
  cursor:pointer;list-style:none;padding:16px 20px;
  display:flex;align-items:flex-start;gap:12px;
  font-size:15px;font-weight:700;color:rgba(255,255,255,.92);
  transition:background .25s ease;
}
.acc summary::-webkit-details-marker{display:none}
.acc summary:hover{background:var(--surface-hover)}
.acc summary .idx{
  flex:0 0 auto;font-family:var(--font-mono);font-size:12px;font-weight:400;
  color:var(--accent);border:1px solid var(--accent-line);background:var(--accent-soft);
  border-radius:var(--radius-sm);min-width:22px;height:20px;line-height:18px;text-align:center;margin-top:2px;
}
.acc summary .arrow{margin-left:auto;flex:0 0 auto;color:var(--text-tertiary);transition:transform .3s cubic-bezier(.16,1,.3,1);font-family:var(--font-mono);font-size:12px;margin-top:4px}

.acc .acc-body{padding:0 20px 20px 54px;color:var(--text-secondary);font-size:14.5px;animation:blurIn .45s cubic-bezier(.16,1,.3,1) both}
.acc .acc-body>*:last-child{margin-bottom:0}
.acc .acc-body p{max-width:none}

/* ─── 网格小卡 ─── */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:0 0 24px}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
.tile{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;

.tile .t-k{font-family:var(--font-mono);font-size:12px;color:var(--accent);margin:0 0 8px;display:block}
/* tile 标题可写成 md 链接（首页工具卡）：虚下划线暗示可点，hover 转实线 */
.tile .t-k a{border-bottom:1px dashed var(--accent-line);transition:border-color .2s}

.doc-footer{

/* 页脚宽度是三页 footer_note 的折中（13px 字号下浏览器实测，CJK 每字恰 1em）：
   旧值 70ch(≈612px) 把首页「生成的 JSON」拦腰拆成「生/成」；

<script>
(function(){
  var items = document.querySelectorAll('.reveal, .timeline li, .stat, .cmp .col, .tile, .acc');
  if (!('IntersectionObserver' in window)) {
    items.forEach(function(el){ el.classList.add('in'); });
    return;
  }
  // 交错延迟：index * 80ms，单组不超过 400ms
  var groups = document.querySelectorAll('.stat-band, .timeline, .cmp, .grid2, .acc, .hero-side');
  groups.forEach(function(g){
    Array.prototype.forEach.call(g.children, function(c, i){
      c.classList.add('reveal');
      c.style.transitionDelay = Math.min(i * 80, 400) + 'ms';
    });
  });
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (e.isIntersecting) {
        e.target.classList.add('in');
        io.unobserve(e.target);
      }
    });
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
  document.querySelectorAll('.reveal').forEach(function(el){ io.observe(el); });
})();
</script>
<script>
/* 右侧悬浮目录：滚动时高亮当前章节 */
(function(){
  var nav = document.querySelector('.toc-rail');
  if (!nav) return;
  var secs = Array.prototype.slice.call(nav.querySelectorAll('a')).map(function(a){
    var el = document.getElementById(a.getAttribute('href').slice(1));
    return el ? {el: el, a: a} : null;
  }).filter(Boolean);
  if (!secs.length) return;
  function top(el){ return el.getBoundingClientRect().top + window.scrollY; }
  function pick(){
    var y = window.scrollY + Math.min(window.innerHeight * 0.3, 240);
    var cur = secs[0];
    // 兜底：滚到文档底部时直接高亮最后一项（最后一节过短，top 永远到不了触发线）
    if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 2) {
      cur = secs[secs.length - 1];
    } else {
      for (var i = 0; i < secs.length; i++){
        if (top(secs[i].el) <= y) cur = secs[i];
      }
    }
    secs.forEach(function(s){ s.a.classList.toggle('active', s === cur); });
  }
  window.addEventListener('scroll', pick, {passive:true});
  window.addEventListener('resize', pick, {passive:true});
  pick();
})();
</script>
<script>
/* TOC 折叠切换：默认圆形图标，点击展开/收起面板 */
(function(){
  var rail = document.querySelector('.toc-rail');
  var fab = document.querySelector('.toc-fab');
  if (!rail || !fab) return;
  function setOpen(open){
    rail.classList.toggle('open', open);
    fab.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  fab.addEventListener('click', function(e){
    e.stopPropagation();
    setOpen(!rail.classList.contains('open'));
  });
  document.addEventListener('click', function(e){
    if (!rail.contains(e.target)) setOpen(false);
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') setOpen(false);
  });
})();
</script>

<script>
/* 主题切换：点击在深色/浅色间切换并写入 localStorage */
(function(){
  var btn = document.getElementById('themeToggle');
  if(!btn) return;
  function sync(){
    var light = document.documentElement.getAttribute('data-theme') === 'light';
    var label = light ? '切换到深色主题' : '切换到浅色主题';
    btn.setAttribute('aria-label', label);
    btn.setAttribute('title', label);
  }
  sync();
  btn.addEventListener('click', function(){
    var light = document.documentElement.getAttribute('data-theme') === 'light';
    var next = light ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('dsh-tui-theme', next); } catch(e){}
    sync();
  });
})();
</script>

<script>
/* 代码块复制按钮：为每个 .code-block 注入「复制」按钮，点击拷贝 <pre> 文本 */
(function(){
  function svgCopy(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
  }
  function svgCheck(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
  }
  function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function(resolve,reject){
      try{
        var ta=document.createElement('textarea');
        ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
        document.body.appendChild(ta);ta.select();
        document.execCommand('copy');document.body.removeChild(ta);
        resolve();
      }catch(e){ reject(e); }
    });
  }
  var blocks=document.querySelectorAll('.code-block');
  blocks.forEach(function(block){
    var head=block.querySelector('.code-head');
    var pre=block.querySelector('pre');
    if(!head||!pre) return;
    var staleCopy=head.querySelector('.copy-btn'); if(staleCopy) staleCopy.remove();   /* 自愈：文件若被平台回写成「渲染后的 DOM」，先清掉旧按钮再重建，避免出现有按钮无监听的死按钮 */
    var btn=document.createElement('button');
    btn.type='button';btn.className='copy-btn';
    btn.setAttribute('aria-label','复制代码');btn.title='复制代码';
    btn.innerHTML=svgCopy();
    btn.addEventListener('click',function(){
      copyText(pre.innerText.trim()).then(function(){
        btn.classList.add('copied');
        btn.innerHTML=svgCheck();
        setTimeout(function(){
          btn.classList.remove('copied');
          btn.innerHTML=svgCopy();
        },1600);
      }).catch(function(){
        btn.innerHTML=svgCopy();
        setTimeout(function(){ btn.innerHTML=svgCopy(); },1600);
      });
    });
    head.appendChild(btn);
  });
})();
</script>

<!-- Prism.js 语法高亮（CDN 版）：先把 .lang 标注映射成 language-* 语言类，再引入各语言组件并高亮 -->
<script>
(function(){
  /* .lang 文本 → Prism 语言类；带 "·" 的副标注只取前段；未知/纯文本则不高亮 */
  var MAP={sh:'bash',bash:'bash',shell:'bash',zsh:'bash',yaml:'yaml',yml:'yaml',markdown:'markdown',md:'markdown',json:'json',js:'javascript',javascript:'javascript',text:'',txt:'',plain:'',none:''};
  document.querySelectorAll('.code-block').forEach(function(b){
    var langEl=b.querySelector('.code-head .lang');
    var code=b.querySelector('pre code');
    if(!langEl||!code) return;
    var raw=(langEl.textContent||'').trim().toLowerCase().split('·')[0].trim();
    var lang=Object.prototype.hasOwnProperty.call(MAP,raw)?MAP[raw]:(/^[a-z0-9+#-]+$/.test(raw)?raw:'');
    if(lang) code.classList.add('language-'+lang);
  });
})();
</script>

<!-- CodeJar「可编辑代码块」（懒加载）：默认保持 Prism 只读展示，点「编辑」才创建编辑器，退出后按编辑结果重绘 -->
<script type="module">
(async function(){
  /* 多 CDN 依次回退：单点 CDN 慢或被墙时不至于整个编辑功能消失 */
  var CDNS = [
    'https://cdn.jsdelivr.net/npm/codejar@4.3.0/dist/codejar.js',
    'https://unpkg.com/codejar@4.3.0/dist/codejar.js',
    'https://esm.sh/codejar@4.3.0'
  ];
  var CodeJar = null;
  for(var i = 0; i < CDNS.length && !CodeJar; i++){
    try{ var m = await import(CDNS[i]); CodeJar = m && m.CodeJar; }catch(e){ CodeJar = null; }
  }
  if(!CodeJar || !window.Prism) return;

  var ICON_EDIT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>';
  var ICON_DONE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';

  function langOf(el){
    var m=/(?:^|\s)language-([a-z0-9+#-]+)/i.exec(el.className||'');
    return m?m[1].toLowerCase():'';
  }
  /* 自己取 grammar 调 Prism.highlight，不用 highlightElement：后者会改类名、干扰 CodeJar 的光标保存/恢复 */
  function paint(el){
    var lang=langOf(el), g=lang && window.Prism.languages[lang];
    if(!g) return;
    el.innerHTML=window.Prism.highlight(el.textContent, g, lang);
  }

  document.querySelectorAll('.code-block').forEach(function(block){
    var head=block.querySelector('.code-head');
    var pre=block.querySelector('pre');
    var code=block.querySelector('pre code');
    if(!head||!pre||!code) return;
    var staleEdit=head.querySelector('.edit-btn'); if(staleEdit) staleEdit.remove();   /* 自愈：同上 */

    var btn=document.createElement('button');
    btn.type='button'; btn.className='edit-btn';
    btn.setAttribute('aria-label','编辑代码'); btn.title='编辑代码';
    btn.innerHTML=ICON_EDIT;

    var jar=null, editing=false;

    btn.addEventListener('click',function(){
      editing=!editing;
      if(editing){
        var raw=code.textContent;            /* 记住纯文本（含原有高亮 span 里的文字） */
        jar=new CodeJar(code, function(el){ paint(el); }, {tab:'  ', addClosing:false, spellcheck:false});
        jar.updateCode(raw);                 /* 关键：CodeJar 构造时不首帧高亮，必须用它官方 API 写入并立即着色 */
        block.classList.add('editing');
        btn.classList.add('active'); btn.innerHTML=ICON_DONE;
        btn.title='完成编辑'; btn.setAttribute('aria-label','完成编辑');
        code.focus();
      }else{
        if(jar){ try{ jar.destroy(); }catch(e){} jar=null; }
        code.removeAttribute('contenteditable');
        code.removeAttribute('spellcheck');
        code.style.whiteSpace=''; code.style.overflowY=''; code.style.overflowWrap=''; code.style.outline='';
        block.classList.remove('editing');
        btn.classList.remove('active'); btn.innerHTML=ICON_EDIT;
        btn.title='编辑代码'; btn.setAttribute('aria-label','编辑代码');
        paint(code);                         /* 退出后按编辑结果重绘；复制按钮复制的也是编辑后的内容 */
      }
    });

    var copyBtn=head.querySelector('.copy-btn');
    if(copyBtn) head.insertBefore(btn, copyBtn); else head.appendChild(btn);
  });
})();
</script>
