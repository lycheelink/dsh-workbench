<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业 Agent 工作台 · Skill 参数配置</title>
<meta name="description" content="场景 Skill 参数配置操作台：在控制台完成参数配置、生成结构化 JSON，复制触发指令到 dsh TUI 启动 Skill 会话。">
<style>
  :root{
    --brand:#2d6cdf; --brand-soft:rgba(45,108,223,.12);
    --bg:#f5f7fa; --panel:#ffffff;
    --ink:#1f2328; --sub:#656d76; --muted:#8b949e;
    --line:#e1e6ec; --line-strong:#cfd6df;
    --radius:12px;
    --shadow:0 1px 2px rgba(15,23,42,.05),0 2px 8px rgba(15,23,42,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}

  /* ---------- 页头（镜像工作台 dsh-wb-page-header） ---------- */
  header{position:sticky;top:0;z-index:20;background:var(--panel);
    border-bottom:1px solid var(--line)}
  .head{max-width:1180px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;
    justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand .mark{width:26px;height:26px;flex:none;border-radius:8px;background:var(--brand);
    display:flex;align-items:center;justify-content:center;color:#fff}
  .brand .mark svg{width:15px;height:15px}
  .brand h1{margin:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .head-nav{display:flex;align-items:center;gap:8px}
  .nav-btn{appearance:none;border:none;background:transparent;color:var(--sub);font-size:12px;
    padding:4px 12px;border-radius:7px;cursor:pointer;font-weight:600}
  .nav-btn:hover{background:var(--brand-soft);color:var(--brand)}
  .nav-btn-active{background:var(--brand-soft);color:var(--brand)}
  .nav-btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .chip{font-size:11px;font-weight:600;color:var(--sub);border:1px solid var(--line-strong);
    border-radius:999px;padding:2px 10px;white-space:nowrap}

  /* ---------- 主体 ---------- */
  main{max-width:1180px;margin:0 auto;padding:24px 20px 40px}
  .intro{margin:0 0 14px;font-size:13px;color:var(--sub);line-height:1.7;max-width:72ch}
  .intro strong{color:var(--ink);font-weight:600}

  /* ---------- 配置流程 ---------- */
  .flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 20px;
    padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .flow-step{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);font-weight:500}
  .flow-step .flow-no{width:18px;height:18px;border-radius:50%;background:#eef2f7;color:var(--muted);
    font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
  .flow-step-now{color:var(--ink);font-weight:600}
  .flow-step-now .flow-no{background:var(--brand);color:#fff}
  .flow-arrow{color:var(--line-strong);font-size:12px;user-select:none}

  /* ---------- 工具栏（镜像 dsh-wb-toolbar） ---------- */
  .toolbar{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
  .search{width:100%;max-width:340px;padding:8px 12px;border:1px solid var(--line-strong);border-radius:10px;
    background:var(--panel);color:var(--ink);font-size:12px;outline:none;font-family:inherit}
  .search:focus{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
  .search::placeholder{color:var(--muted)}
  .filters{display:flex;flex-wrap:wrap;gap:6px}
  .filter-chip{appearance:none;border:1px solid var(--line-strong);background:transparent;color:var(--sub);
    font-size:11px;padding:3px 12px;border-radius:999px;cursor:pointer;font-weight:600;
    transition:background-color 120ms ease,border-color 120ms ease,color 120ms ease}
  .filter-chip:hover{background:#eef2f7}
  .filter-chip-active{background:var(--brand);border-color:var(--brand);color:#fff}
  .filter-chip:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

  /* ---------- 卡片网格（镜像 dsh-wb-card-list / dsh-wb-card） ---------- */
  .card-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,400px));
    justify-content:start;gap:12px}
  .card{display:flex;flex-direction:column;gap:10px;width:100%;min-width:0;text-align:left;padding:14px 14px 12px;
    border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);color:var(--ink);
    cursor:pointer;transition:border-color 140ms ease,box-shadow 140ms ease,transform 140ms ease;font-size:14px}
  .card:hover{transform:translateY(-2px);border-color:var(--brand);box-shadow:0 6px 18px rgba(0,0,0,.08)}
  .card:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .card-icon-tile{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;
    border-radius:10px;color:#fff}
  .card-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px}
  .card-title{font-weight:600;font-size:14px;line-height:1.4}
  .card-category{font-size:10px;padding:2px 8px;border-radius:999px;background:#eef2f7;color:var(--sub);
    white-space:nowrap;font-weight:600}
  .card-desc{margin:0;font-size:12px;line-height:1.55;color:var(--sub);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card-footer{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .card-cta{font-size:12px;color:var(--brand);opacity:0;transition:opacity 140ms ease;font-weight:600}
  .card:hover .card-cta{opacity:1}
  .empty{padding:32px 0;text-align:center;color:var(--muted);font-size:12px;grid-column:1/-1}

  footer{max-width:1180px;margin:0 auto;padding:0 20px 28px;text-align:center;color:var(--muted);font-size:11.5px}

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<header>
  <div class="head">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7v6c0 5 3.8 8.5 9 9 5.2-.5 9-4 9-9V7z"/><path d="m9 12 2 2 4-4"/></svg></div>
      <h1>企业 Agent 工作台</h1>
    </div>
    <div class="head-nav">
      <button type="button" class="nav-btn nav-btn-active" disabled aria-disabled="true">场景卡片</button>
      <span class="chip">Skill 参数配置</span>
    </div>
  </div>
</header>

<main>
  <p class="intro">
    三个场景 <strong>Skill</strong> 的参数配置操作台：在控制台完成参数配置、实时生成结构化 JSON，
    复制触发指令后到 <strong>dsh TUI</strong> 粘贴启动 Skill 会话。无需后端，随开随用。
  </p>

  <div class="flow" role="list" aria-label="配置流程">
    <span class="flow-step flow-step-now" role="listitem"><span class="flow-no" aria-hidden="true">1</span>选择场景</span>
    <span class="flow-arrow" aria-hidden="true">→</span>
    <span class="flow-step" role="listitem"><span class="flow-no" aria-hidden="true">2</span>配置参数</span>
    <span class="flow-arrow" aria-hidden="true">→</span>
    <span class="flow-step" role="listitem"><span class="flow-no" aria-hidden="true">3</span>复制触发指令</span>
    <span class="flow-arrow" aria-hidden="true">→</span>
    <span class="flow-step" role="listitem"><span class="flow-no" aria-hidden="true">4</span>dsh TUI 启动 Skill</span>
  </div>

  <div class="toolbar">
    <input type="text" class="search" id="search" placeholder="搜索场景…" autocomplete="off">
    <div class="filters" id="filters"></div>
  </div>

  <div class="card-list" id="cardList"></div>
</main>

<footer>场景 Skill 参数配置操作台 · 控制台生成的触发指令经 dsh TUI 启动 Skill</footer>

<script>
"use strict";
// ── 固定卡片（新增场景卡片时在此追加一项即可） ──────────────────────────────
// 每项：{ id, title, description, icon, category, consoleUrl }
//   icon       → "shield-check" | "chart-bar" | "document-text"（可扩展 ICONS）
//   category   → 决定 icon tile 配色（见 CATEGORY_COLORS，缺省取品牌蓝）
//   consoleUrl → 卡片打开的控制台独立页
const CARDS = [
  {
    id: "model-oob-perf-optimize",
    title: "开箱寻优",
    category: "寻优",
    icon: "shield-check",
    consoleUrl: "perf-optimize-params.html",
    description: "开箱即用的推理性能自动寻优工具，根据用户输入的寻优需求（模型权重路径、硬件型号、测试工具、寻优目标、寻优要求），自动完成业务建模、寻优参数配置、启动寻优测试、分析寻优结果。支持智能模式（一键寻优免交互）、PD 分离寻优、多机寻优、阶梯寻优。"
  },
  {
    id: "ascend-profiler",
    title: "Profiling 采集",
    category: "寻优",
    icon: "chart-bar",
    consoleUrl: "profiling-collect-params.html",
    description: "昇腾推理 Profiling 采集与分析：可对已运行在线服务 attach 采集，可由 profiler 拉起推理服务并驱动 workload 采集，也可直接分析已有 profiling 数据，产出瓶颈分析结果。"
  },
  {
    id: "veriflow",
    title: "验证流测试",
    category: "测试",
    icon: "document-text",
    consoleUrl: "veriflow-params.html",
    description: "面向 LLM 推理服务的验证流框架：按声明式 YAML 配置自动启动 vLLM 推理服务（本地或 SSH 跨节点，支持多机数据并行与 PD 分离），运行精度 / 性能 / 长稳测试（vllm bench、lm-eval、evalscope），并与验收标准逐条比对，产出通过/失败全景报告（veriflow_report.md + veriflow_summary.json）。"
  }
];

const CATEGORY_COLORS = { "寻优": "#2d6cdf", "测试": "#2e9e5b", "通用": "#d97706" };
const ICONS = {
  "shield-check": '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>',
  "chart-bar": '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>',
  "document-text": '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>'
};

// ── 渲染 ────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const state = { search: "", category: "全部" };

function renderFilters(){
  const cats = ["全部", ...new Set(CARDS.map(c => c.category))];
  $("filters").innerHTML = cats.map(cat =>
    '<button type="button" class="filter-chip' + (cat === state.category ? " filter-chip-active" : "") + '" data-cat="' + esc(cat) + '">' + esc(cat) + "</button>"
  ).join("");
  $("filters").querySelectorAll(".filter-chip").forEach(btn => {
    btn.addEventListener("click", () => { state.category = btn.dataset.cat; render(); });
  });
}
function renderCards(){
  const q = state.search.trim().toLowerCase();
  const list = CARDS.filter(c =>
    (state.category === "全部" || c.category === state.category) &&
    (q === "" || c.title.toLowerCase().includes(q) || c.description.toLowerCase().includes(q))
  );
  $("cardList").innerHTML = list.length
    ? list.map(c =>
        '<button type="button" class="card" data-id="' + esc(c.id) + '" aria-label="打开 ' + esc(c.title) + ' 控制台">' +
          '<div class="card-icon-tile" style="background:' + (CATEGORY_COLORS[c.category] || "#2d6cdf") + '">' +
            (ICONS[c.icon] || ICONS["document-text"]) +
          "</div>" +
          '<div class="card-body"><span class="card-title">' + esc(c.title) + "</span>" +
          '<p class="card-desc">' + esc(c.description) + "</p></div>" +
          '<div class="card-footer"><span class="card-category">' + esc(c.category) + "</span>" +
          '<span class="card-cta" aria-hidden="true">打开控制台 →</span></div>' +
        "</button>"
      ).join("")
    : '<div class="empty">—</div>';
  $("cardList").querySelectorAll(".card").forEach(btn => {
    btn.addEventListener("click", () => openCard(btn.dataset.id));
  });
}
function render(){
  renderFilters();
  renderCards();
}
function openCard(id){
  const c = CARDS.find(x => x.id === id);
  if(c) window.open(c.consoleUrl, "_blank", "noopener");
}

// ── 搜索 ────────────────────────────────────────────────────────────────
$("search").addEventListener("input", e => { state.search = e.target.value; renderCards(); });

// ── 初始化 ──────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
