name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Build host + client
        run: npm run build
      - name: Doc drift check (dist/index.html vs index.md)
        run: python3 scripts/build-doc.py --check
      - name: Smoke + rc-verify
        run: npm test
